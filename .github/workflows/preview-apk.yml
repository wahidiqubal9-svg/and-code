name: Preview APK

on:
  push:
    branches: [preview-apk]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Set app version
        run: |
          echo "ANDCODE_VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "ANDCODE_VERSION_NAME=1.2.29-preview.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "ANDCODE_UPDATE_REPOSITORY=wahidiqubal9-svg/and-code" >> "$GITHUB_ENV"
      - name: Ensure preview signing key
        run: |
          if [ ! -f preview-keystore.jks ]; then
            keytool -genkeypair -v \
              -storetype JKS \
              -keystore preview-keystore.jks \
              -storepass andcodepreview \
              -keypass andcodepreview \
              -alias andcodepreview \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=AndCode Preview,O=AndCode,C=US"
          fi
      - name: Build debug APK
        env:
          GITHUB_CLIENT_ID: ${{ vars.AND_CODE_GITHUB_CLIENT_ID }}
        run: ./gradlew :app:assembleGithubDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: andcode-preview-debug
          path: app/build/outputs/apk/github/debug/app-github-debug.apk
          if-no-files-found: error
      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<EOF
          Preview build of AndCode from the fork's main.

          versionCode: ${ANDCODE_VERSION_CODE}

          Signed with the pinned preview key, so installing this over an earlier preview build updates in place and keeps data.
          EOF
          gh release create "v${ANDCODE_VERSION_NAME}" \
            app/build/outputs/apk/github/debug/app-github-debug.apk \
            --title "AndCode preview ${ANDCODE_VERSION_NAME}" \
            --notes-file release-notes.md \
            --latest
      - name: Upload signing key
        uses: actions/upload-artifact@v4
        with:
          name: andcode-preview-keystore
          path: preview-keystore.jks
          if-no-files-found: error
