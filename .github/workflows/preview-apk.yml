name: Preview APK

on:
  push:
    branches: [preview-apk]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Ensure preview signing key
        run: |
          if [ ! -f preview-keystore.jks ]; then
            keytool -genkeypair -v \
              -storetype JKS \
              -keystore preview-keystore.jks \
              -storepass andcodepreview \
              -keypass andcodepreview \
              -alias andcodepreview \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=AndCode Preview,O=AndCode,C=US"
          fi
      - name: Build debug APK
        run: ./gradlew :app:assembleGithubDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: andcode-preview-debug
          path: app/build/outputs/apk/github/debug/app-github-debug.apk
          if-no-files-found: error
      - name: Upload signing key
        uses: actions/upload-artifact@v4
        with:
          name: andcode-preview-keystore
          path: preview-keystore.jks
          if-no-files-found: error
