name: Preview APK

on:
  push:
    branches: [preview-apk]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: andcode-preview-debug-keystore-v1
      - name: Build debug APK
        run: ./gradlew :app:assembleGithubDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: andcode-preview-debug
          path: app/build/outputs/apk/github/debug/app-github-debug.apk
          if-no-files-found: error
      - name: Back up signing key
        uses: actions/upload-artifact@v4
        with:
          name: andcode-preview-keystore
          path: ~/.android/debug.keystore
          if-no-files-found: error
